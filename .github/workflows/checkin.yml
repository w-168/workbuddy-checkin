name: WorkBuddy 每日签到

on:
  schedule:
    # 每天北京时间 09:00 触发（UTC 01:00）
    # 注意：GitHub 不保证准时，实际通常延迟 5~30 分钟
    - cron: '0 1 * * *'
  workflow_dispatch:  # 允许手动触发

  # 推送即跑一次，方便立刻验证配置是否正确。
  # 签到接口幂等（当天重复调用会返回"今天已签到"），所以不会重复领积分。
  # 若不想每次推送都跑，删掉下面三行即可。
  push:
    branches: [main]

jobs:
  checkin:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 登录态完全来自 GitHub Secret，不访问任何本机/个人电脑上的文件，
      # 因此电脑关机、不开机都不影响定时任务执行。
      - name: 恢复登录态（仅使用 GitHub Secret）
        env:
          AUTH_INFO: ${{ secrets.WORKBUDDY_AUTH_INFO }}
        run: |
          set -euo pipefail

          if [ -z "${AUTH_INFO:-}" ]; then
            echo "::error::未配置 Secret WORKBUDDY_AUTH_INFO，无法签到"
            echo "请到 Settings -> Secrets and variables -> Actions 添加该 Secret"
            exit 1
          fi

          mkdir -p adapters
          printf '%s' "$AUTH_INFO" > adapters/.auth-info.json
          chmod 600 adapters/.auth-info.json

          # 校验 JSON 合法且含必需字段，避免 Secret 粘错时静默失败
          python check_auth.py adapters/.auth-info.json

      - name: 执行签到
        env:
          SERVERCHAN_SCKEY: ${{ secrets.SERVERCHAN_SCKEY }}
          BARK_URL: ${{ secrets.BARK_URL }}
          NOTIFY_WEBHOOK: ${{ secrets.NOTIFY_WEBHOOK }}
        run: |
          set -o pipefail
          # tee 会吞掉退出码，用 PIPESTATUS[0] 取回 python 的真实结果，
          # 保证签到失败时本步骤（以及整个 workflow）判定为失败
          python run_local.py 2>&1 | tee checkin.log
          exit "${PIPESTATUS[0]}"

      - name: 上传日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkin-log
          path: checkin.log
          if-no-files-found: warn
          retention-days: 7
